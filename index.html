<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sylvia Nkosi | Aspiring Software Developer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 620px;
    }

    .profile-pic {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid #60a5fa;
      margin-bottom: 24px;
      object-fit: cover;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.8rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 1.35rem;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .message {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    footer {
      margin-top: 60px;
      color: #64748b;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="profile.jpg" alt="Sylvia Nkosi" class="profile-pic">
    
    <h1>Hi, I'm Sylvia Nkosi</h1>
    <p class="subtitle">Aspiring Software Developer</p>
    
    <p class="message">
      My website is currently undergoing a major transition.<br>
      I'm working hard to bring you a better experience.<br><br>
      <strong>Please come back soon!</strong>
    </p>

    <!-- Cleaner mailto link - better for recruiters using Outlook -->
    <a href="mailto:sylviapsnkosi@gmail.com?subject=Inquiry%20from%20Your%20Portfolio" 
       class="btn">
      Get in touch
    </a>

    <footer>
      © 2026 Sylvia Nkosi • Johannesburg, South Africa
    </footer>
  </div>
</body>
</html>
